<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #12141c;
      --card-bg: #1a1d26;
      --border-color: #2a2e3d;
      --pink-primary: #ff2d78;
      --pink-hover: #e01d67;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .top-tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--bg-color);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .source-selectors {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .source-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .source-option.active {
      color: var(--pink-primary);
      background: rgba(255, 45, 120, 0.1);
    }

    .source-option svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .device-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      font-size: 12px;
    }

    .device-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    select {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    select option {
      background: var(--card-bg);
      color: var(--text-main);
    }

    #startBtn {
      width: 100%;
      padding: 12px;
      background-color: var(--pink-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 45, 120, 0.3);
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    #startBtn:hover {
      background-color: var(--pink-hover);
    }

    #stopBtn {
      width: 100%;
      padding: 12px;
      background-color: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: none;
      margin-top: 6px;
    }

    #status {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Tabs -->
  <div class="top-tabs">
    <div class="tab active" id="recordTab">Record</div>
    <div class="tab" id="videosTab">Your videos</div>
  </div>

  <!-- Capture Mode Selectors -->
  <div class="source-selectors">
    <div class="source-option active" data-source="screen">
      <svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg>
      Screen
    </div>
    <div class="source-option" data-source="tab">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      Tab area
    </div>
    <div class="source-option" data-source="camera">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      Camera
    </div>
  </div>

  <!-- Audio / Mic Device Row -->
  <div class="device-row">
    <div class="device-info">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      Microphone
    </div>
    <select id="micSelect">
      <option value="default">Default Microphone</option>
      <option value="none">Off</option>
    </select>
  </div>

  <!-- Action Buttons & Status -->
  <button id="startBtn">Start recording</button>
  <button id="stopBtn">Stop recording</button>
  <div id="status">Ready to capture session</div>

  <script src="popup.js"></script>
</body>
</html>
